<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS Interface</title>
  <style>
    :root {
      --cyan: #00f0ff;
      --dark-bg: #050b14;
      --panel-bg: rgba(10, 25, 47, 0.9);
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--dark-bg);
      color: var(--cyan);
      font-family: 'Segoe UI', Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* JARVIS Arc Reactor / Glowing Orb */
    .jarvis-container {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .orb {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,240,255,0.9) 0%, rgba(0,100,150,0.4) 60%, rgba(0,0,0,0) 70%);
      box-shadow: 0 0 40px var(--cyan), inset 0 0 20px var(--cyan);
      animation: pulse 3s infinite ease-in-out;
    }

    .ring {
      position: absolute;
      border: 2px dashed var(--cyan);
      border-radius: 50%;
      animation: spin 10s linear infinite;
    }

    .ring-1 { width: 140px; height: 140px; border-width: 2px; }
    .ring-2 { width: 170px; height: 170px; border-style: solid; border-color: rgba(0, 240, 255, 0.3) transparent; animation-duration: 6s; }

    .listening .orb {
      background: radial-gradient(circle, rgba(255,50,50,0.9) 0%, rgba(150,0,0,0.4) 60%, rgba(0,0,0,0) 70%);
      box-shadow: 0 0 50px #ff3232, inset 0 0 20px #ff3232;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.98); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Control Panel */
    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--cyan);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
      border-radius: 8px;
      padding: 1.5rem;
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    .status-text {
      font-size: 0.9rem;
      letter-spacing: 2px;
      margin-bottom: 1rem;
      text-transform: uppercase;
    }

    .settings-panel {
      display: none;
      background: rgba(0,0,0,0.6);
      border: 1px dashed var(--cyan);
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 4px;
      text-align: left;
    }

    .settings-panel label {
      font-size: 0.75rem;
      display: block;
      margin-top: 6px;
    }

    .settings-panel input {
      width: 95%;
      background: #000;
      border: 1px solid var(--cyan);
      color: #fff;
      padding: 6px;
      border-radius: 3px;
      font-size: 0.8rem;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    input[type="text"] {
      flex: 1;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--cyan);
      padding: 10px;
      color: #fff;
      border-radius: 4px;
      outline: none;
    }

    button {
      background: transparent;
      border: 1px solid var(--cyan);
      color: var(--cyan);
      padding: 8px 14px;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
      transition: all 0.3s;
    }

    button:hover {
      background: var(--cyan);
      color: #000;
      box-shadow: 0 0 10px var(--cyan);
    }

    .log-box {
      margin-top: 12px;
      height: 120px;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 8px;
      font-size: 0.85rem;
      text-align: left;
      overflow-y: auto;
      color: #a0f0ff;
    }
  </style>
</head>
<body>

  <div class="jarvis-container" id="jarvisUI">
    <div class="ring ring-2"></div>
    <div class="ring ring-1"></div>
    <div class="orb"></div>
  </div>

  <div class="panel">
    <div class="status-text" id="statusLabel">JARVIS System Online</div>

    <button onclick="toggleSettings()" style="margin-bottom: 8px; font-size: 0.8rem;">⚙️ Settings</button>

    <!-- Configuration Settings Form -->
    <div class="settings-panel" id="settingsPanel">
      <label>ESP32 IP Address (e.g. 192.168.1.15):</label>
      <input type="text" id="espIpInput" placeholder="192.168.1.XX">
      
      <label>NVIDIA NIM API Key (nvapi-...):</label>
      <input type="password" id="nimKeyInput" placeholder="nvapi-...">
      
      <button onclick="saveSettings()" style="margin-top: 8px; width: 100%;">Save Credentials</button>
    </div>
    
    <div class="input-group">
      <input type="text" id="commandInput" placeholder="Ask JARVIS or give command...">
      <button onclick="processInput()">Send</button>
      <button onclick="toggleVoice()">🎙️</button>
    </div>

    <div class="log-box" id="logBox">
      <div>[SYSTEM]: Ready for instructions. Please verify IP & API Key in Settings.</div>
    </div>
  </div>

  <script>
    const speechSynth = window.speechSynthesis;
    let recognition;

    const localKeywords = ["socket", "relay", "time", "date", "temp", "temperature", "humidity", "today"];

    // Load credentials from browser localStorage
    window.onload = () => {
      if (localStorage.getItem("jarvis_esp_ip")) {
        document.getElementById("espIpInput").value = localStorage.getItem("jarvis_esp_ip");
      }
      if (localStorage.getItem("jarvis_nim_key")) {
        document.getElementById("nimKeyInput").value = localStorage.getItem("jarvis_nim_key");
      }
    };

    function toggleSettings() {
      const panel = document.getElementById("settingsPanel");
      panel.style.display = panel.style.display === "block" ? "none" : "block";
    }

    function saveSettings() {
      const ip = document.getElementById("espIpInput").value.trim().replace("http://", "").replace("/", "");
      const key = document.getElementById("nimKeyInput").value.trim();
      
      localStorage.setItem("jarvis_esp_ip", ip);
      localStorage.setItem("jarvis_nim_key", key);
      
      log("Configuration saved successfully.");
      toggleSettings();
    }

    function log(msg) {
      const box = document.getElementById("logBox");
      box.innerHTML += `<div>> ${msg}</div>`;
      box.scrollTop = box.scrollHeight;
    }

    function speak(text) {
      if (!text) return;
      speechSynth.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.pitch = 0.9;
      utterance.rate = 1.0;
      speechSynth.speak(utterance);
    }

    function isHardwareCommand(text) {
      const lower = text.toLowerCase();
      return localKeywords.some(kw => lower.includes(kw));
    }

    async function processInput() {
      const inputEl = document.getElementById("commandInput");
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = "";
      log(`User: "${text}"`);

      if (isHardwareCommand(text)) {
        await sendToESP32(text);
      } else {
        await queryNvidiaNIM(text);
      }
    }

    async function sendToESP32(commandText) {
      const ip = localStorage.getItem("jarvis_esp_ip");
      if (!ip) {
        log("ERROR: ESP32 IP not set! Please enter it in Settings.");
        speak("Please set the ESP32 IP address in settings.");
        return;
      }

      const url = `http://${ip}/send-text`;
      log(`Routing hardware request to ${url}...`);

      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: commandText })
        });
        const data = await res.json();
        log(`JARVIS: ${data.speech}`);
        speak(data.speech);
      } catch (err) {
        log(`ESP32 Connection Error (${err.message})`);
        speak("Failed to connect to the local ESP32 board.");
      }
    }

    async function queryNvidiaNIM(promptText) {
      const key = localStorage.getItem("jarvis_nim_key");
      if (!key) {
        log("ERROR: NVIDIA NIM API Key not set! Enter it in Settings.");
        speak("Please set your NVIDIA API key in settings.");
        return;
      }

      log("Routing query to NVIDIA NIM Cloud...");

      try {
        const response = await fetch("https://integrate.api.nvidia.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${key}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "meta/llama-3.1-70b-instruct",
            messages: [
              { 
                role: "system", 
                content: "You are JARVIS, an advanced, smart AI assistant. Answer concisely in 1 or 2 clear sentences suitable for voice speech." 
              },
              { role: "user", content: promptText }
            ],
            temperature: 0.5,
            max_tokens: 150
          })
        });

        const result = await response.json();
        if (result.choices && result.choices.length > 0) {
          const reply = result.choices[0].message.content;
          log(`JARVIS: ${reply}`);
          speak(reply);
        } else {
          log("NVIDIA NIM Error: " + JSON.stringify(result));
          speak("API authorization or request error.");
        }
      } catch (err) {
        log("NVIDIA API Network Error.");
        speak("Unable to connect to NVIDIA NIM intelligence.");
      }
    }

    // Speech Recognition
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        document.getElementById("jarvisUI").classList.add("listening");
        document.getElementById("statusLabel").innerText = "JARVIS Listening...";
      };

      recognition.onend = () => {
        document.getElementById("jarvisUI").classList.remove("listening");
        document.getElementById("statusLabel").innerText = "JARVIS System Online";
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById("commandInput").value = transcript;
        processInput();
      };
    }

    function toggleVoice() {
      if (recognition) recognition.start();
    }
  </script>
</body>
</html>

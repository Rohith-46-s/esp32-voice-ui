<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Voice Assistant Switchboard</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #121212; color: white; }
        button { padding: 15px 25px; font-size: 18px; cursor: pointer; border-radius: 8px; border: none; background: #007bff; color: white; margin: 10px; }
        #status { font-size: 20px; color: #4CAF50; margin-top: 20px; }
    </style>
</head>
<body>

    <h2>Smart Switchboard Voice Assistant</h2>
    <button onclick="sendCommand('what is the time')">Ask Time</button>
    <button onclick="sendCommand('turn on socket one')">Socket 1 ON</button>
    <button onclick="sendCommand('turn off socket one')">Socket 1 OFF</button>

    <div id="status">Ready</div>

    <script>
        const ESP32_IP = "http://10.93.188.112";

        // Speaks text out loud using Device Speaker
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop current audio
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Text-to-speech not supported on this browser.");
            }
        }

        async function sendCommand(textCommand) {
            document.getElementById('status').innerText = "Sending: " + textCommand;
            
            try {
                const response = await fetch(`${ESP32_IP}/send-text`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: textCommand })
                });

                const data = await response.json();

                if (data.status === "success" && data.speech) {
                    document.getElementById('status').innerText = "Response: " + data.speech;
                    speak(data.speech); // Speak through phone/laptop speaker
                }
            } catch (error) {
                document.getElementById('status').innerText = "Error connecting to ESP32!";
                speak("Failed to connect to switchboard.");
            }
        }
    </script>
</body>
</html>

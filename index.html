<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS AI System Interface</title>
  <style>
    :root {
      --cyan: #00f0ff;
      --dark-bg: #050b14;
      --panel-bg: rgba(10, 25, 47, 0.85);
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--dark-bg);
      color: var(--cyan);
      font-family: 'Segoe UI', Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* JARVIS Arc Reactor / Glowing Orb */
    .jarvis-container {
      position: relative;
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .orb {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,240,255,0.9) 0%, rgba(0,100,150,0.4) 60%, rgba(0,0,0,0) 70%);
      box-shadow: 0 0 40px var(--cyan), inset 0 0 20px var(--cyan);
      animation: pulse 3s infinite ease-in-out;
    }

    .ring {
      position: absolute;
      border: 2px dashed var(--cyan);
      border-radius: 50%;
      animation: spin 10s linear infinite;
    }

    .ring-1 { width: 160px; height: 160px; border-width: 2px; }
    .ring-2 { width: 190px; height: 190px; border-style: solid; border-color: rgba(0, 240, 255, 0.3) transparent; animation-duration: 6s; }

    .listening .orb {
      background: radial-gradient(circle, rgba(255,50,50,0.9) 0%, rgba(150,0,0,0.4) 60%, rgba(0,0,0,0) 70%);
      box-shadow: 0 0 50px #ff3232, inset 0 0 20px #ff3232;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.98); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Control Panel */
    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--cyan);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
      border-radius: 8px;
      padding: 1.5rem;
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    .status-text {
      font-size: 0.9rem;
      letter-spacing: 2px;
      margin-bottom: 1rem;
      text-transform: uppercase;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    input[type="text"] {
      flex: 1;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--cyan);
      padding: 10px;
      color: #fff;
      border-radius: 4px;
      outline: none;
    }

    button {
      background: transparent;
      border: 1px solid var(--cyan);
      color: var(--cyan);
      padding: 10px 18px;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
      transition: all 0.3s;
    }

    button:hover {
      background: var(--cyan);
      color: #000;
      box-shadow: 0 0 10px var(--cyan);
    }

    .log-box {
      margin-top: 15px;
      height: 100px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 8px;
      font-size: 0.85rem;
      text-align: left;
      overflow-y: auto;
      color: #a0f0ff;
    }
  </style>
</head>
<body>

  <div class="jarvis-container" id="jarvisUI">
    <div class="ring ring-2"></div>
    <div class="ring ring-1"></div>
    <div class="orb"></div>
  </div>

  <div class="panel">
    <div class="status-text" id="statusLabel">JARVIS System Online</div>
    
    <div class="input-group">
      <input type="text" id="commandInput" placeholder="Ask JARVIS or give command...">
      <button onclick="processInput()">Send</button>
      <button onclick="toggleVoice()">🎙️</button>
    </div>

    <div class="log-box" id="logBox">
      <div>[SYSTEM]: Ready for instructions...</div>
    </div>
  </div>

  <script>
    // Configuration
    const ESP32_URL = "http://YOUR_ESP32_IP/send-text"; 
    const NVIDIA_NIM_KEY = "YOUR_NVIDIA_NIM_API_KEY"; 
    const NVIDIA_MODEL = "meta/llama-3.1-70b-instruct";

    const speechSynth = window.speechSynthesis;
    let recognition;

    // Local hardware keyword patterns
    const localKeywords = ["socket", "relay", "time", "date", "temp", "temperature", "humidity", "today"];

    function log(msg) {
      const box = document.getElementById("logBox");
      box.innerHTML += `<div>> ${msg}</div>`;
      box.scrollTop = box.scrollHeight;
    }

    function speak(text) {
      if (!text) return;
      speechSynth.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.pitch = 0.9;
      utterance.rate = 1.0;
      
      // Select a clear voice if available
      const voices = speechSynth.getVoices();
      const preferredVoice = voices.find(v => v.name.includes("Natural") || v.name.includes("Google") || v.name.includes("David"));
      if (preferredVoice) utterance.voice = preferredVoice;

      speechSynth.speak(utterance);
    }

    function isHardwareCommand(text) {
      const lower = text.toLowerCase();
      return localKeywords.some(kw => lower.includes(kw));
    }

    async function processInput() {
      const inputEl = document.getElementById("commandInput");
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = "";
      log(`User: "${text}"`);

      if (isHardwareCommand(text)) {
        log("Routing to ESP32 Hardware Controller...");
        await sendToESP32(text);
      } else {
        log("Routing to NVIDIA NIM Cloud Intelligence...");
        await queryNvidiaNIM(text);
      }
    }

    async function sendToESP32(commandText) {
      try {
        const res = await fetch(ESP32_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: commandText })
        });
        const data = await res.json();
        log(`JARVIS: ${data.speech}`);
        speak(data.speech);
      } catch (err) {
        log("Error connecting to ESP32 board.");
        speak("Failed to communicate with local hardware modules.");
      }
    }

    async function queryNvidiaNIM(promptText) {
      try {
        const response = await fetch("https://integrate.api.nvidia.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${NVIDIA_NIM_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: NVIDIA_MODEL,
            messages: [
              { 
                role: "system", 
                content: "You are JARVIS, an advanced concise AI assistant. Provide direct, smart, single-sentence or concise answers suitable for voice playback." 
              },
              { role: "user", content: promptText }
            ],
            temperature: 0.5,
            max_tokens: 150
          })
        });

        const result = await response.json();
        const reply = result.choices[0].message.content;
        log(`JARVIS: ${reply}`);
        speak(reply);
      } catch (err) {
        log("NVIDIA NIM API Error.");
        speak("I encountered an issue processing your request through the cloud neural network.");
      }
    }

    // Voice Recognition Initialization
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        document.getElementById("jarvisUI").classList.add("listening");
        document.getElementById("statusLabel").innerText = "JARVIS Listening...";
      };

      recognition.onend = () => {
        document.getElementById("jarvisUI").classList.remove("listening");
        document.getElementById("statusLabel").innerText = "JARVIS System Online";
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById("commandInput").value = transcript;
        processInput();
      };
    }

    function toggleVoice() {
      if (recognition) recognition.start();
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Switchboard Interface</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; padding: 20px; }
    .card { max-width: 420px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 10px; }
    input, button { width: 90%; padding: 12px; margin: 8px 0; border-radius: 6px; border: none; font-size: 14px; }
    input { background: #2a2a2a; color: white; text-align: center; }
    button { background: #007bff; color: white; font-weight: bold; cursor: pointer; }
    button.listening { background: #dc3545; }
    .grid { display: flex; gap: 8px; justify-content: center; }
    .grid button { width: 45%; background: #333; }
    #log { margin-top: 15px; padding: 10px; background: #000; color: #00ff66; text-align: left; font-family: monospace; font-size: 12px; min-height: 100px; border-radius: 6px; }
  </style>
</head>
<body>

<div class="card">
  <h2>Voice Smart Switchboard</h2>

  <label>ESP32 IP Address</label>
  <input type="text" id="espIp" value="10.93.188.112" />

  <button id="micBtn" onclick="toggleListening()">🎤 Tap & Speak</button>

  <div class="grid">
    <button onclick="processCommand('what is the time')">🕒 Time</button>
    <button onclick="processCommand('what is temperature')">🌡️ Temp</button>
  </div>
  <div class="grid">
    <button onclick="processCommand('turn on socket 1')">🔌 Socket 1 ON</button>
    <button onclick="processCommand('turn off socket 1')">🔌 Socket 1 OFF</button>
  </div>

  <div id="log">Ready</div>
</div>

<script>
  // NVIDIA NIM Configured
  const NIM_KEY = "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";
  
  let recognition;
  let isListening = false;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';

    recognition.onresult = async (e) => {
      const text = e.results[0][0].transcript;
      log(`Recognized: "${text}"`);
      await processCommand(text);
    };

    recognition.onend = () => resetMicBtn();
  }

  function toggleListening() {
    const btn = document.getElementById('micBtn');
    if (!isListening) {
      recognition.start();
      isListening = true;
      btn.innerText = "🎙️ Listening...";
      btn.classList.add("listening");
    } else {
      recognition.stop();
      resetMicBtn();
    }
  }

  function resetMicBtn() {
    isListening = false;
    const btn = document.getElementById('micBtn');
    btn.innerText = "🎤 Tap & Speak";
    btn.classList.remove("listening");
  }

  async function processCommand(userText) {
    const lower = userText.toLowerCase();
    const isHardware = lower.includes("socket") || lower.includes("time") || lower.includes("temp") || lower.includes("humidity");

    let finalCommand = userText;

    if (!isHardware) {
      log("Querying NVIDIA NIM (nvidia/ising-calibration-1.5-31b)...");
      finalCommand = await queryNim(userText);
    }

    await sendToEsp32(finalCommand);
  }

  async function queryNim(promptText) {
    try {
      const res = await fetch("https://integrate.api.nvidia.com/v1/chat/completions", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${NIM_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model: "nvidia/ising-calibration-1.5-31b",
          messages: [
            { role: "system", content: "You are a smart switchboard voice assistant. Keep answers under 12 words." },
            { role: "user", content: promptText }
          ]
        })
      });

      const data = await res.json();
      return data.choices[0].message.content.trim();
    } catch (err) {
      log("NIM Error: " + err.message);
      return promptText;
    }
  }

  async function sendToEsp32(cmd) {
    const ip = document.getElementById('espIp').value.trim();
    log(`Sending to ESP32: "${cmd}"`);

    try {
      const res = await fetch(`http://${ip}/send-text`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: cmd })
      });

      const result = await res.json();
      log(`Response: ${result.speech}`);
      speakOutLoud(result.speech);
    } catch (err) {
      log("ESP32 Communication Error!");
      speakOutLoud("Failed to reach switchboard.");
    }
  }

  function speakOutLoud(speechText) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(speechText);
      window.speechSynthesis.speak(utterance);
    }
  }

  function log(msg) {
    document.getElementById('log').innerText = msg;
  }
</script>

</body>
</html>
